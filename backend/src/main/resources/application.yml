server:
  port: ${PORT:8080}

spring:
  application:
    name: lekseradar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lekseradar}
    username: ${DB_USER:lekseradar}
    password: ${DB_PASSWORD:lekseradar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    # В проде обязательно задайте JWT_SECRET (минимум 32 символа)
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-123456}
    ttl-hours: ${JWT_TTL_HOURS:72}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    # Если ключа нет, бэкенд отвечает заглушками, чтобы фронт можно было разрабатывать без OpenAI
    mock-when-no-key: ${OPENAI_MOCK:true}
    timeout-seconds: 60
    chat-history-limit: 20
