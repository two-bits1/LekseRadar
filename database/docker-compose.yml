# Локальный PostgreSQL для LekseRadar: docker compose up -d (из папки database/)
# Миграции применяются при первом запуске пустого тома (база пустая, без демо-данных).
# Сбросить базу: docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lekseradar
      POSTGRES_USER: lekseradar
      POSTGRES_PASSWORD: lekseradar   # только для локальной разработки
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
volumes:
  pgdata:
